
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$PROJECT_NAME - Release Notification</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:'Segoe UI', Arial, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:24px 0;">
<tr>
<td align="center">

  <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <!-- HERO / ANNOUNCEMENT BANNER -->
    <tr>
      <td style="background-color:__BANNER_COLOR__; padding:32px 32px;" bgcolor="__BANNER_COLOR__">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center" valign="top" style="text-align:center;">
              <div style="color:#ffffff; font-size:30px; font-weight:800; letter-spacing:0.3px; margin-bottom:10px;">
                __ANNOUNCEMENT_TITLE__
              </div>
              <div style="color:#ffffff; font-size:20px; font-weight:600; opacity:0.92;">
                __ANNOUNCEMENT_SUBTITLE__
              </div>
              <div style="line-height:28px; font-size:1px;">&nbsp;</div>
              <div>
                <!--[if mso]>
                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" style="height:48px;width:340px;v-text-anchor:middle;" arcsize="50%" stroke="f" fillcolor="__BADGE_COLOR__">
                  <center style="color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:700;">$PROJECT_NAME &middot; Build #$BUILD_NUMBER</center>
                </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-->
                <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto;">
                  <tr>
                    <td style="background-color:__BADGE_COLOR__; border-radius:24px; padding:16px 20px; color:#ffffff; font-size:16px; font-weight:700; letter-spacing:0.5px; white-space:nowrap;" bgcolor="__BADGE_COLOR__">
                      $PROJECT_NAME &middot; Build #$BUILD_NUMBER
                    </td>
                  </tr>
                </table>
                <!--<![endif]-->
              </div>
            </td>
            <td align="right" valign="middle" width="100" style="font-size:100px; line-height:1;">
              __EMOJI__
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- SUMMARY CARDS: Triggered by / Node / Duration side-by-side.
         Rounded corners EVERYWHERE, including classic Outlook desktop:
         the Word engine ignores CSS border-radius, so each card wraps its
         two-line content in a VML <v:roundrect>+<v:textbox>. Outlook paints
         the rounded fill from the VML shape (and ignores the inner div's
         background-color, which Word doesn't render on bare divs), while
         every non-Outlook client ignores the mso-only VML comments and
         renders the rounded <div> directly. Keeping BOTH lines inside a
         single wrapper div (not merged onto one run) preserves the
         title-over-value layout. All three VML shapes share one fixed
         height (120px) with v-text-anchor:middle so the cards stay equal
         height in Outlook no matter how long a value is; non-Outlook clients
         equalize automatically because the cards share one table row. -->
    <tr>
      <td style="padding:28px 32px 0 32px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td width="33%" valign="top">
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" arcsize="11%" fillcolor="#fdf4ff" stroked="f" style="width:168px;height:120px;v-text-anchor:middle;">
              <v:textbox inset="8px,12px,8px,12px">
              <![endif]-->
              <div style="background-color:#fdf4ff; border-radius:12px; padding:16px 12px; text-align:center;">
                <div style="font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:0.8px; color:#a21caf; text-align:center;">Triggered by <span style="font-size:22px; text-transform:none; letter-spacing:normal; vertical-align:middle;">&#128640;</span></div>
                <div style="font-size:14px; font-weight:600; color:#111827; text-align:center;">$CAUSE</div>
              </div>
              <!--[if mso]>
              </v:textbox>
              </v:roundrect>
              <![endif]-->
            </td>
            <td style="width:12px; font-size:0; line-height:0;">&nbsp;</td>
            <td width="33%" valign="top">
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" arcsize="11%" fillcolor="#ecfeff" stroked="f" style="width:168px;height:120px;v-text-anchor:middle;">
              <v:textbox inset="8px,12px,8px,12px">
              <![endif]-->
              <div style="background-color:#ecfeff; border-radius:12px; padding:16px 12px; text-align:center;">
                <div style="font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:0.8px; color:#0e7490; text-align:center;">Node <span style="font-size:22px; text-transform:none; letter-spacing:normal; vertical-align:middle;">&#128421;&#65039;</span></div>
                <div style="font-size:14px; font-weight:600; color:#111827; text-align:center;">__NODE_NAME__</div>
              </div>
              <!--[if mso]>
              </v:textbox>
              </v:roundrect>
              <![endif]-->
            </td>
            <td style="width:12px; font-size:0; line-height:0;">&nbsp;</td>
            <td width="33%" valign="top">
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" arcsize="11%" fillcolor="#fef9c3" stroked="f" style="width:168px;height:120px;v-text-anchor:middle;">
              <v:textbox inset="8px,12px,8px,12px">
              <![endif]-->
              <div style="background-color:#fef9c3; border-radius:12px; padding:16px 12px; text-align:center;">
                <div style="font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:0.8px; color:#a16207; text-align:center;">Duration <span style="font-size:22px; text-transform:none; letter-spacing:normal; vertical-align:middle;">&#9203;&#65039;</span></div>
                <div style="font-size:14px; font-weight:600; color:#111827; text-align:center;">__DURATION__</div>
              </div>
              <!--[if mso]>
              </v:textbox>
              </v:roundrect>
              <![endif]-->
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Spacer row: guarantees a gap below the cards. The cards' VML shapes
         auto-grow with content and can overlap the next row in Outlook, so a
         real <tr> here reserves vertical space Word won't let the shape cover. -->
    <tr>
      <td height="24" style="height:24px; line-height:24px; font-size:1px;">&nbsp;</td>
    </tr>

    <!-- ACTION BUTTONS -->
    <tr>
      <td style="padding:28px 32px 8px 32px; text-align:center;">
        <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto;">
          <tr>
            <!-- Button 1: View Build -->
            <td>
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="$BUILD_URL" style="height:44px;v-text-anchor:middle;width:170px;" arcsize="16%" stroke="t" strokecolor="#7c3aed" fillcolor="#f3e8ff">
                <w:anchorlock/>
                <center style="color:#6d28d9;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;">View Build</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!-->
              <a href="$BUILD_URL" target="_blank" style="background-color:#f3e8ff; border:1px solid #7c3aed; border-radius:6px; color:#6d28d9; display:inline-block; font-family:'Segoe UI',Arial,sans-serif; font-size:15px; font-weight:600; line-height:42px; text-align:center; text-decoration:none; width:168px;">View Build</a>
              <!--<![endif]-->
            </td>
            <td style="width:10px; font-size:0; line-height:0;">&nbsp;</td>
            <!-- Button 2: Console Output -->
            <td>
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="${BUILD_URL}console" style="height:44px;v-text-anchor:middle;width:170px;" arcsize="16%" stroke="t" strokecolor="#0891b2" fillcolor="#ecfeff">
                <w:anchorlock/>
                <center style="color:#0e7490;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;">Console Output</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!-->
              <a href="${BUILD_URL}console" target="_blank" style="background-color:#ecfeff; border:1px solid #0891b2; border-radius:6px; color:#0e7490; display:inline-block; font-family:'Segoe UI',Arial,sans-serif; font-size:15px; font-weight:600; line-height:42px; text-align:center; text-decoration:none; width:168px;">Console Output</a>
              <!--<![endif]-->
            </td>
            <td style="width:10px; font-size:0; line-height:0;">&nbsp;</td>
            <!-- Button 3: Pipeline Overview -->
            <td>
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="${BUILD_URL}stages/" style="height:44px;v-text-anchor:middle;width:170px;" arcsize="16%" stroke="t" strokecolor="#059669" fillcolor="#ecfdf5">
                <w:anchorlock/>
                <center style="color:#047857;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;">Pipeline Overview</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!-->
              <a href="${BUILD_URL}stages/" target="_blank" style="background-color:#ecfdf5; border:1px solid #059669; border-radius:6px; color:#047857; display:inline-block; font-family:'Segoe UI',Arial,sans-serif; font-size:15px; font-weight:600; line-height:42px; text-align:center; text-decoration:none; width:168px;">Pipeline Overview</a>
              <!--<![endif]-->
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- FOOTER -->
    <tr>
      <td style="padding:28px 32px; text-align:center;">
        <div style="font-size:13px; color:#9ca3af; border-top:2px solid #7c3aed; padding-top:16px;">
          Sent by Jenkins &middot; <a href="$JENKINS_URL" style="color:#7c3aed; text-decoration:none;">$JENKINS_URL</a><br>
          $PROJECT_NAME &middot; Build #$BUILD_NUMBER
        </div>
      </td>
    </tr>

  </table>

</td>
</tr>
</table>

</body>
</html>
